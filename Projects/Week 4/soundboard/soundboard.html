<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Soundboard</title>
  </head>
  <body>
    <header>
      <h1>Sound<span>board</span></h1>
    </header>
    <main>
      <section>
        <img src="/sounds/geluid1.png" alt="rode knop" width="100px" />
        <audio controls>
          <source src="/sounds/geluid1.mp3" />
        </audio>
      </section>
      <section>
        <img
          src="/sounds/geluid2.png"
          alt="schetenlatend mannetje"
          width="100px"
        />
        <audio controls>
          <source src="/sounds/geluid2.mp3" />
        </audio>
      </section>
      <section>
        <img src="/sounds/geluid3.png" alt="foto van een bel" width="100px" />
        <audio controls>
          <source src="/sounds/geluid3.mp3" />
        </audio>
      </section>
      <section>
        <img
          src="/sounds/geluid4.jpg"
          alt="trommelend mannetje"
          width="100px"
        />
        <audio controls>
          <source src="/sounds/geluid4.mp3" />
        </audio>
      </section>
    </main>
  </body>
</html>
