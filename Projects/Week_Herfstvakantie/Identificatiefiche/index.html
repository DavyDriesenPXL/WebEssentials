<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Identifiecatiefiche</title>
  </head>
  <body>
    <table>
      <caption>
        Identifiecatiefiche van Mickey Mouse
      </caption>
      <tbody>
        <tr>
          <th>Voornaam</th>
          <td>Mickey</td>
          <td rowspan="3"><img width="100" src="mickey.jpg" /></td>
        </tr>
        <tr>
          <th>Naam</th>
          <td>Mouse</td>
        </tr>
        <tr>
          <th>Geboortejaar</th>
          <td>1928</td>
        </tr>
        <tr>
          <th rowspan="4" class="top">Huidig adres</th>
        </tr>
        <tr>
          <td colspan="2">Bd de Parc</td>
        </tr>
        <tr>
          <td colspan="2">77700 Coupvray</td>
        </tr>
        <tr>
          <td colspan="2">Frankrijk</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
